<script>
const REPO='peeppop-art/peeppop-art.github.io';
const categories=[{key:'textile',title:'Textile & Products',description:'Textile designs and original items.'},{key:'sketches',title:'Sketches',description:'Bird sketches, field drawings, and daily drawings.'},{key:'projects',title:'Projects',description:'Space, research, and collaborative works.'}];
const placeholder=`<div class="placeholder"><svg viewBox="0 0 64 64"><rect x="7" y="10" width="50" height="43" rx="7"/><circle cx="22" cy="24" r="5"/><path d="M10 46 27 31 36 39 44 30 55 43"/></svg><span>Photo coming soon</span></div>`;
const $=id=>document.getElementById(id);
const base=new URL('./',location.href);
function imageUrl(value){if(!value||typeof value!=='string')return '';if(/^https:\/\//i.test(value))return value;if(/^data:image\//i.test(value))return value;return new URL(value.replace(/^\/+/,''),base).href}
function makeImage(src,alt){const img=document.createElement('img');img.src=imageUrl(src);img.alt=alt||'';img.loading='lazy';return img}
function categoryFor(work){return categories.find(c=>c.key===work.category)||categories[0]}
let works=[];
function showDetail(work){const body=$('detailBody');body.replaceChildren();const heading=document.createElement('h2');heading.textContent=work.title||'Untitled';body.append(heading);const meta=document.createElement('p');meta.className='note';meta.textContent=[categoryFor(work).title,work.year].filter(Boolean).join(' · ');body.append(meta);const images=[work.cover,...(Array.isArray(work.gallery)?work.gallery:[])].filter(Boolean);if(images.length){const gallery=document.createElement('div');gallery.className='detail-images';for(const item of [...new Set(images.map(x=>typeof x==='string'?x:x?.image||x?.src).filter(Boolean))])gallery.append(makeImage(item,work.title));body.append(gallery)}const desc=document.createElement('p');desc.className='detail-description';desc.textContent=work.description||'';body.append(desc);$('workDialog').showModal()}
function render(){const wrap=$('cards');wrap.replaceChildren();for(const cat of categories){const entries=works.filter(w=>w.category===cat.key);const card=document.createElement('div');card.className='card';const photo=document.createElement('div');photo.className='photo';if(entries[0]?.cover)photo.append(makeImage(entries[0].cover,entries[0].title));else photo.innerHTML=placeholder;const heading=document.createElement('h3');heading.textContent=cat.title;const arrow=document.createElement('span');arrow.textContent='→';heading.append(arrow);const desc=document.createElement('p');desc.textContent=entries.length?`${entries.length} work${entries.length===1?'':'s'} · ${cat.description}`:cat.description;card.append(photo,heading,desc);wrap.append(card);if(entries.length){card.tabIndex=0;card.setAttribute('role','button');card.setAttribute('aria-label',`View ${cat.title} works`);const open=()=>showCategory(cat,entries);card.onclick=open;card.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open()}}}}
}
let sketchImages=[];
let sketchIndex=0;
function sketchSource(item){return typeof item==='string'?item:item?.image||item?.src||''}
function showSketchImage(index){if(!sketchImages.length)return;sketchIndex=(index+sketchImages.length)%sketchImages.length;const image=$('sketchFullImage');image.src=imageUrl(sketchImages[sketchIndex].src);image.alt=sketchImages[sketchIndex].alt;$('sketchCounter').textContent=`${sketchIndex+1} / ${sketchImages.length}`;if(!$('sketchLightbox').open)$('sketchLightbox').showModal()}
function showCategory(cat,entries){const body=$('detailBody');body.replaceChildren();const heading=document.createElement('h2');heading.textContent=cat.title;body.append(heading);
if(cat.key==='sketches'){
 sketchImages=[];const gallery=document.createElement('div');gallery.className='sketch-gallery';
 for(const work of entries){const paths=[work.cover,...(Array.isArray(work.gallery)?work.gallery:[])].map(sketchSource).filter(Boolean);for(const src of new Set(paths)){const index=sketchImages.length;sketchImages.push({src,alt:work.title||'Sketch'});const tile=document.createElement('button');tile.type='button';tile.className='sketch-tile';tile.setAttribute('aria-label',`View sketch ${index+1}`);tile.append(makeImage(src,work.title||'Sketch'));tile.onclick=()=>showSketchImage(index);gallery.append(tile)}}
 if(!sketchImages.length){const note=document.createElement('p');note.textContent='Sketches coming soon.';body.append(note)}else body.append(gallery);
 $('workDialog').showModal();return;
}
for(const work of entries){const btn=document.createElement('button');btn.style.cssText='display:flex;align-items:center;gap:15px;width:100%;padding:12px 0;border:0;border-bottom:1px solid #ddd;background:white;text-align:left;font:inherit;cursor:pointer';if(work.cover){const img=makeImage(work.cover,work.title);img.style.cssText='width:90px;height:80px;object-fit:cover;border-radius:12px';btn.append(img)}const title=document.createElement('span');title.textContent=`${work.title||'Untitled'}${work.year?' · '+work.year:''} →`;btn.append(title);btn.onclick=()=>showDetail(work);body.append(btn)}$('workDialog').showModal()}
$('sketchExit').onclick=()=>$('sketchLightbox').close();
$('sketchPrev').onclick=()=>showSketchImage(sketchIndex-1);
$('sketchNext').onclick=()=>showSketchImage(sketchIndex+1);
$('sketchLightbox').addEventListener('click',e=>{if(e.target===$('sketchLightbox'))$('sketchLightbox').close()});
document.addEventListener('keydown',e=>{if(!$('sketchLightbox').open)return;if(e.key==='ArrowLeft'){e.preventDefault();showSketchImage(sketchIndex-1)}if(e.key==='ArrowRight'){e.preventDefault();showSketchImage(sketchIndex+1)}});

function addAboutSection(container,heading,value){
  if(typeof value!=='string'||!value.trim())return;
  if(heading){const h=document.createElement('h3');h.className='about-subheading';h.textContent=heading;container.append(h)}
  const p=document.createElement('p');p.className='about-copy';p.textContent=value.trim();container.append(p);
}
function renderExhibitions(container,items){
  if(!Array.isArray(items)||!items.length)return;
  const heading=document.createElement('h3');heading.className='about-subheading';heading.textContent='Exhibitions & Activities';container.append(heading);
  const list=document.createElement('div');list.className='exhibition-list';
  for(const item of items){
    if(!item||typeof item!=='object')continue;
    const entry=document.createElement('article');entry.className='exhibition-item';
    if(typeof item.poster==='string'&&item.poster.trim()){
      const img=makeImage(item.poster,item.title||'Exhibition poster');img.className='exhibition-poster';img.loading='lazy';entry.append(img);
    }else{entry.style.gridTemplateColumns='1fr'}
    const info=document.createElement('div');info.className='exhibition-info';
    if(item.title){const title=document.createElement('h4');title.textContent=String(item.title);info.append(title)}
    const meta=[item.year,item.location].filter(v=>v!==undefined&&v!==null&&String(v).trim()).join(' · ');
    if(meta){const p=document.createElement('p');p.className='exhibition-meta';p.textContent=meta;info.append(p)}
    if(item.description){const p=document.createElement('p');p.className='exhibition-description';p.textContent=String(item.description);info.append(p)}
    if(info.childNodes.length){entry.append(info);list.append(entry)}
  }
  if(list.childNodes.length)container.append(list);else heading.remove();
}
async function loadAbout(){
  try{
    const response=await fetch(`https://raw.githubusercontent.com/${REPO}/main/content/about.json`,{cache:'no-store'});
    if(!response.ok)throw Error(`About HTTP ${response.status}`);
    const data=await response.json();
    const wrap=$('about-content');wrap.replaceChildren();
    addAboutSection(wrap,'',data.intro||data.introduction);
    addAboutSection(wrap,'Education',data.education);
    addAboutSection(wrap,'Research & Practice',data.research);
    const exhibitionItems=Array.isArray(data.exhibitions)?data.exhibitions:(Array.isArray(data.exhibition_items)?data.exhibition_items:[]);
    renderExhibitions(wrap,exhibitionItems);
    if(!exhibitionItems.length)addAboutSection(wrap,'Exhibitions & Activities',data.exhibitions);
    addAboutSection(wrap,'Contact',data.contact);
  }catch(err){console.warn('Could not load About; showing default text:',err)}
}
async function loadWorks(){try{const response=await fetch(`https://api.github.com/repos/${REPO}/contents/content/works?ref=main`,{cache:'no-store'});if(response.status===404){render();return}if(!response.ok)throw Error(`GitHub API ${response.status}`);const files=await response.json();if(!Array.isArray(files))throw Error('Unexpected response');const results=await Promise.all(files.filter(f=>f.name.endsWith('.json')&&f.type==='file').map(async f=>{try{const r=await fetch(f.download_url,{cache:'no-store'});if(!r.ok)return null;return await r.json()}catch{return null}}));works=results.filter(w=>w&&typeof w==='object'&&typeof w.title==='string');works.sort((a,b)=>(Number(b.year)||0)-(Number(a.year)||0));render()}catch(err){console.warn('Could not load works:',err);render();const status=document.createElement('p');status.className='work-status';status.textContent='Works are temporarily unavailable. Please try refreshing later.';$('works').append(status)}}
$('closeDialog').onclick=()=>$('workDialog').close();$('workDialog').addEventListener('click',e=>{if(e.target===$('workDialog'))$('workDialog').close()});
$('menu').onclick=()=>{const open=$('links').classList.toggle('open');$('menu').setAttribute('aria-expanded',String(open))};document.querySelectorAll('.links a').forEach(a=>a.addEventListener('click',()=>{$('links').classList.remove('open');$('menu').setAttribute('aria-expanded','false')}));$('year').textContent=new Date().getFullYear();render();loadWorks();loadAbout();
</script></body></html>
